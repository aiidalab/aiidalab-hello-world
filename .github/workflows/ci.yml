---
name: CI

on:
    push:
        branches:
            - main
    pull_request:

env:
    FORCE_COLOR: "1"

jobs:

    pre-commit:

        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:

            - uses: actions/checkout@v7

            - uses: j178/prek-action@v3.1.0

            # Make sure app's metadata can be parsed
            - name: Parse app metadata
              run: |
                uvx aiidalab registry parse-app-repo .


    unit-tests:

        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            matrix:
                python-version: ['3.12', '3.13']
            fail-fast: false

        steps:

            - uses: actions/checkout@v7

            - name: Set up uv
              uses: astral-sh/setup-uv@v10.3.3
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Run unit tests
              run: uv run pytest tests/


    notebook-tests:

        strategy:
            matrix:
                browser: [chromium, firefox]
                docker-tag: [edge]
            fail-fast: false

        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:

            - name: Check out app
              uses: actions/checkout@v7

            - name: Setup uv
              uses: astral-sh/setup-uv@v7
              with:
                  python-version: '3.12'

            - name: Set jupyter token env
              run: echo "JUPYTER_TOKEN=$(openssl rand -hex 32)" >> $GITHUB_ENV

            - name: Install Playwright browser
              run: uv run playwright install --with-deps ${{ matrix.browser }}

            - name: Run notebook tests
              run: uv run pytest -v --browser ${{ matrix.browser }} tests_notebooks/
              env:
                  TAG: ${{ matrix.docker-tag }}

            - name: Upload screenshots as artifacts
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: Screenshots-${{ matrix.docker-tag }}-${{ matrix.browser }}
                  path: screenshots/
                  if-no-files-found: error
